<section id="precios" class="pricing">
  <div class="pricing__inner">

    <div class="pricing__header" appReveal>
      <div class="section-tag">
        <span class="section-tag__line"></span>Planes y precios<span class="section-tag__line"></span>
      </div>
      <h2 class="section-h2">Elige tu plan y empieza a ahorrar</h2>
      <p class="section-lead">Sin permanencia. Cambia o cancela cuando quieras.</p>
    </div>

    <!-- Billing toggle -->
    <div class="pricing__toggle">
      <div class="pricing__toggle-inner">
        <button (click)="billing = 'mensual'" class="billing-btn" [class.active]="billing === 'mensual'">
          Mensual
        </button>
        <button (click)="billing = 'anual'" class="billing-btn" [class.active]="billing === 'anual'">
          Anual <span style="font-size:11px;opacity:0.8;">−20%</span>
        </button>
      </div>
    </div>

    <!-- Plan cards -->
    <div class="pricing__grid">
      <div *ngFor="let plan of plans; trackBy: trackByName" appReveal
        class="plan-card"
        [class.featured]="plan.featured">

        <span *ngIf="plan.featured" class="plan-card__badge">Más popular</span>

        <h3 class="plan-card__name">{{ plan.name }}</h3>
        <p class="plan-card__tagline">{{ plan.tagline }}</p>

        <div class="plan-card__price">
          <span class="plan-card__price-val">{{ getPrice(plan) }}</span>
          <span class="plan-card__price-period">{{ getPeriod(plan) }}</span>
        </div>

        <a href="#" class="cc-pricing-btn plan-card__cta">{{ plan.cta }}</a>

        <div class="plan-card__features">
          <div *ngFor="let feat of plan.features" class="plan-card__feat">
            <svg class="plan-card__feat-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span>{{ feat }}</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
