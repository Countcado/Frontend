<section class="testimonials">
  <div class="testimonials__blob"></div>

  <div class="testimonials__inner">
    <div class="testimonials__header" appReveal>
      <div class="section-tag">
        <span class="section-tag__line"></span>Valoraciones<span class="section-tag__line"></span>
      </div>
      <h2 class="section-h2">Lo que dicen nuestros cocineros</h2>
    </div>

    <div class="testimonials__carousel">
      <!-- Track -->
      <div class="testimonials__track-wrap">
        <div class="testimonials__track" [style.transform]="trackTransform">
          <div *ngFor="let t of testimonials" class="testimonials__slide">
            <div class="testimonials__card">
              <div class="testimonials__stars">{{ t.stars }}</div>
              <p class="testimonials__quote">"{{ t.text }}"</p>
              <div class="testimonials__author">
                <div class="testimonials__avatar">{{ t.initials }}</div>
                <div class="testimonials__author-info">
                  <div class="testimonials__author-name">{{ t.name }}</div>
                  <div class="testimonials__author-role">{{ t.role }}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="testimonials__controls">
        <button (click)="prev()" aria-label="Anterior" class="testi-nav-btn cc-testi-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>

        <div class="testimonials__dots">
          <button *ngFor="let t of testimonials; let i = index"
            (click)="goTo(i)" aria-label="Ir al testimonio"
            class="testimonials__dot"
            [class.active]="i === tIndex">
          </button>
        </div>

        <button (click)="next()" aria-label="Siguiente" class="testi-nav-btn cc-testi-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>
