<header [class.scrolled]="isScrolled">
  <div class="wrap nav">
    <a href="#" class="brand" aria-label="CountCado inicio">
      <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M20 3c-5 0-9 5-9 13s4 21 9 21 9-13 9-21S25 3 20 3z" fill="#7ba428"/>
        <path d="M20 3c-5 0-9 5-9 13s4 21 9 21V3z" fill="#a7c957"/>
        <circle cx="20" cy="24" r="6.5" fill="#a96b3c"/>
        <circle cx="20" cy="24" r="6.5" fill="url(#nav-g)" fill-opacity=".25"/>
        <defs>
          <radialGradient id="nav-g" cx=".4" cy=".35" r=".7">
            <stop stop-color="#fff"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
        </defs>
      </svg>
      Count<b>Cado</b>
    </a>

    <nav class="nav-links" aria-label="Principal">
      <a href="#beneficios">Beneficios</a>
      <a href="#como">Cómo funciona</a>
      <a href="#recetas">Recetas</a>
      <a href="#precios">Precios</a>
    </nav>

    <div class="nav-cta">
      <a href="#" class="login">Entrar</a>
      <a href="#precios" class="btn btn-primary">Crear cuenta</a>
      <button class="burger" (click)="toggleMenu()" [attr.aria-expanded]="mobileOpen" aria-label="Abrir menú">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="mobile-menu" [class.open]="mobileOpen">
    <a href="#beneficios" (click)="closeMenu()">Beneficios</a>
    <a href="#como" (click)="closeMenu()">Cómo funciona</a>
    <a href="#recetas" (click)="closeMenu()">Recetas</a>
    <a href="#precios" (click)="closeMenu()">Precios</a>
    <a href="#precios" class="btn btn-primary" (click)="closeMenu()">Crear cuenta</a>
  </div>
</header>
