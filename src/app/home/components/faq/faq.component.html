<section class="faq">
  <div class="wrap faq-wrap">
    <div class="sec-head" style="text-align:center;margin-left:auto;margin-right:auto" appReveal>
      <span class="eyebrow">Dudas frecuentes</span>
      <h2>Lo que sueles preguntar.</h2>
    </div>

    <div class="q" *ngFor="let faq of faqs; let i = index" [class.open]="faq.open" appReveal>
      <button (click)="toggle(i)">
        {{ faq.q }}
        <span class="ic">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </span>
      </button>
      <div class="ans">
        <p>{{ faq.a }}</p>
      </div>
    </div>
  </div>
</section>
